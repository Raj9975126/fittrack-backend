services:
  - type: web
    name: fittrack-backend
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString

databases:
  - name: fittrack-db
    plan: free
    databaseName: fittrack
    user: fittrack_user
