services:
  - type: web
    name: fittrack-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && node prisma/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health

databases:
  - name: fittrack-postgres
    plan: free
    region: oregon
    databaseName: fittrack_db
    user: fittrack_user
