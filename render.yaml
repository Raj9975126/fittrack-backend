services:
  - type: web
    name: fittrack-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run seed && npm run seed:demo && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: fittrack_super_secure_jwt_secret_key_2026
